[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memo"
version = "0.4.0"
description = "Lightweight HTTP API + MCP server for SQLite vector document storage (single-global on server4 as of 2026-06-29)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Pinned on 2026-07-30. Unpinned, a rebuild resolves mcp 2.0.0, which
    # removed `mcp.server.fastmcp` — the image cannot import main.py at all,
    # so any rebuild would have taken memo down fleet-wide. 1.29 does import
    # and serve correctly here, but memo-v2 pins <1.29 over a fastmcp import
    # path change; matching that band keeps the two trees on one story and
    # keeps this service on what it has proven since 2026-07-22.
    "mcp>=1.23.0,<1.29.0",
    "openai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
]

[project.scripts]
memo = "memo.main:main"
memo-hooks = "memo.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]
