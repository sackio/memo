[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memo"
version = "2.0.0-alpha1"
description = "Memo v2 — bi-temporal + mediated + integration-ready knowledge substrate for a fleet of agents. See specs/001-memo-renovation/ for the design."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "mcp>=1.23.0,<1.29.0",  # pinned <1.29 — 1.29 moved fastmcp import path and breaks v1-shape main.py; migrate to new path later during v2 refactor
    "openai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
# Test-only deps. Kept out of the runtime image; installed by the Dockerfile's
# `test` stage. httpx is required by fastapi's TestClient, which the Phase 3
# mediator contract tests need.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
memo = "memo.main:main"
memo-hooks = "memo.hooks:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict mode: async tests declare @pytest.mark.asyncio and async fixtures MUST
# use @pytest_asyncio.fixture. A plain @pytest.fixture async generator is never
# awaited in strict mode and silently becomes a no-op — pinned explicitly here
# so the mode can't drift and quietly disable fixture teardown.
asyncio_mode = "strict"
