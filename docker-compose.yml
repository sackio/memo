services:
  memo-v2:
    build: .
    container_name: memo-v2
    restart: unless-stopped
    # Use host networking to avoid Docker's network address pool exhaustion.
    # Container binds directly to the host's network stack on the port set
    # inside the memo process (default 8000 unless overridden by MEMO_PORT).
    network_mode: host
    volumes:
      - memo_v2_data:/data
      # ⛔ NO TRANSCRIPT BIND-MOUNTS. The container reads NOTHING from local disk;
      # it ssh's to every host INCLUDING server4, via the restricted key below.
      #
      # Why: server4's project dirs are symlinks into /fast4, and snap-packaged
      # Docker CANNOT bind-mount paths outside $HOME — /fast4 mounted as an EMPTY
      # directory. Measured 2026-08-10: the local path saw 14 of 1,179 session
      # files and reported it as a clean scan, because a directory existed and the
      # hostname was right. ⭐ A mount that "succeeded" is not evidence the data
      # arrived. Going over ssh uniformly removes the special case rather than
      # patching it, and one code path cannot disagree with itself.
      # The CLI itself, so the container runs THE SAME FILE rather than a second
      # implementation of the instruction/tool_result classifier that would drift
      # silently — both copies would keep returning plausible results.
      - /mnt/nas/data/code/scripts/transcript-search:/usr/local/bin/transcript-search:ro
      - /mnt/nas/data/code/scripts/transcript-search-forced:/usr/local/bin/transcript-search-forced:ro
      # The RESTRICTED key. Its authorized_keys entry on all four hosts pins
      # command="…/transcript-search-forced", so this key cannot open a shell or
      # chain to another host — it can run one search and nothing else. Verified
      # 2026-08-10: `ssh -i <key> host whoami` runs the SEARCH, not whoami.
      - /home/ben/.ssh/memo-transcript-search:/run/secrets/ts-key:ro
      # Host keys, so ssh can VERIFY the four hosts. Without this every remote
      # returns "Host key verification failed" and coverage silently drops to
      # zero — which happened 2026-08-10 when this line was deleted along with an
      # unrelated block, while the env var still pointed at the missing file.
      # ⛔ Never substitute StrictHostKeyChecking=no: turning verification off to
      # make a search convenient is a real downgrade on a path that holds a key.
      - /home/ben/.ssh/known_hosts:/run/secrets/known_hosts:ro
    environment:
      DEFAULT_DB_PATH: /data/memo.db
      # ⛔⛔ THE FLEET REACHES memo ON :8000. THIS DEFAULT IS 8091 AND IS A TRAP.
      # Until 2026-08-19 there was no `.env`, and the live container only ran on
      # 8000 because whoever created it on 08-12 had MEMO_V2_PORT=8000 exported
      # in their shell. A plain `docker compose up -d --build` here would have
      # silently come up on 8091 — memo gone from :8000 for ~50 seats, container
      # reporting healthy, and the watch loop's own remote probes failing in a
      # way that looks like the IPv4-bind outage.
      # ⇒ `.env` now pins MEMO_V2_PORT=8000 (gitignored; it also carries
      # OPENROUTER_API_KEY, which config.py requires with no default).
      # ⭐ A default that has never once been exercised in production is not a
      # fallback — it is an untested code path with a plausible number in it.
      PORT: ${MEMO_V2_PORT:-8091}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # 2026-08-01: SELF-HOSTED qwen3-embedding-4b at native 2560, on the LAN
      # endpoint (no auth). Supersedes the 2026-07-31 T203 choice of 3-large@3072,
      # whose measurements survive as research.md R-09 — the comparison baseline.
      # v1 on :8000 stays on 3-small/1536 and is unaffected — separate compose
      # file, separate .env, separate database. Scores are NOT comparable across
      # any two of the three until re-measured.
      #
      # ⚠️ The shell on this host STILL exports EMBEDDING_MODEL=...-3-small and
      # EMBEDDING_DIMENSIONS=1536 (checked again 2026-08-01, still true). That is
      # precisely why the lines below must stay literal.
      #
      # HARD-CODED, and the `${EMBEDDING_MODEL:-...}` form was deliberately
      # REMOVED. This host exports EMBEDDING_MODEL/EMBEDDING_DIMENSIONS in the
      # shell environment, and `${VAR:-default}` takes the shell's value — so the
      # default written here was dead text. Editing it changed nothing, the
      # container came up on 3-small/1536, and the only reason that was caught is
      # that the dimensions were read back off the live tables instead of assumed.
      # A config knob that silently ignores the file it is written in is worse
      # than no knob. Override for a one-off run with an explicit
      # `EMBEDDING_MODEL=... docker compose up` if ever needed.
      # ⛔⛔ THE WIDTH IS THE ONLY THING STOPPING SILENT CROSS-SPACE MIXING, AND
      # THE WIDTH IS A PARAMETER. Measured on a scratch vec0 table 2026-08-03:
      # a `float[2560]` column REJECTS a 3072 vector on BOTH insert and query
      # (`OperationalError: Dimension mismatch ...`). That is why moving between
      # qwen3@2560 and 3-large@3072 fails loudly instead of mis-ranking.
      #
      # ⚠️ That protection is an ACCIDENT OF ARITHMETIC, NOT A DESIGN.
      # `text-embedding-3-large` serves arbitrary output widths by truncation,
      # so a future `EMBEDDING_DIMENSIONS: 2560` here would write 3-large vectors
      # into a qwen3-shaped store WITH NO ERROR ON EITHER SIDE — and cosine
      # between two models is meaningless, so every neighbour returned would be
      # confidently wrong with nothing raised and nothing logged.
      # ⇒ **Two different models at the SAME width is the unrecoverable case.**
      # Keep 3-large at its NATIVE 3072 (Ben's call 2026-07-31, and the reason he
      # gave was safety, not quality). Never set a truncated width to "match"
      # an existing table. (`embeddings` seat raised this 2026-08-03.)
      #
      # ⛔ ALL FOUR LINES ARE REQUIRED. Omitting the URL/key does NOT fall back
      # to OpenRouter — `config.py`'s DEFAULTS were changed to the qwen3 LAN
      # service on 2026-08-01 (`embedding_base_url` defaults to
      # http://192.168.1.5:31536/v1). So a "removed" setting silently
      # re-selects qwen3 while this file still reads `3-large`, and the mismatch
      # surfaces only as a dimension error at write time — if you are lucky.
      # ⇒ **A code default that moved is not a fallback; it is a different
      # config wearing the word "default".**
      # ⭐ 2026-08-10, Ben: "rebuild from main yes we definitely need to use our
      # own free embeddings." Moved OFF paid OpenRouter 3-large/3072 and ONTO the
      # self-hosted qwen3 service. All four lines changed TOGETHER — see the
      # unrecoverable case described above: 3-large serves arbitrary widths by
      # truncation, so changing DIMENSIONS to 2560 while MODEL still read
      # 3-large would have written truncated 3-large vectors into a qwen3-shaped
      # store with NO error on either side, and every neighbour returned would be
      # confidently wrong. Two different models at the same width is the case
      # nothing catches.
      #
      # ⚠️ THE STORE WAS REBUILT EMPTY FOR THIS. 3072 vectors cannot be converted
      # to 2560 — cosine between two models is meaningless, not merely noisier —
      # so all 9,200 documents were re-embedded through the LAN service rather
      # than migrated.
      #
      # ⛔ VERIFYING THIS WORKED NEEDS THE MODEL NAME, NOT THE WIDTH. A store full
      # of truncated 3-large vectors is also 2560 wide. Check
      # `SELECT embedding_model, COUNT(*) FROM document_chunks GROUP BY 1`.
      # ⭐ 2026-08-12: BASE URL ONLY moved to memo's OWN embedding pod. Model name
      # and width are UNCHANGED, which per the warning above is the safe shape of
      # this edit — but it is not sufficient on its own, and here is the gap.
      #
      # ⛔ THE MODEL-NAME CHECK ON LINE 103 NO LONGER SETTLES IT. Both pods serve
      # `served-model-name=qwen3-embedding-4b` from the same HF id and image, and
      # NEITHER MANIFEST PINS A REVISION — they downloaded weights ~10 days apart.
      # So `SELECT embedding_model` returns the same string either way, and the
      # unrecoverable case (two different models at the same width, no error on
      # either side) can now arrive through a URL change alone.
      # ⇒ **A name is not a version. Identical config is not identical weights.**
      # `models` gated the cutover on MEASURING it: same texts embedded on :31536
      # and :31541, compared elementwise (max abs delta + cosine).
      #
      # ✅ THAT COMPARISON WAS CONFIRMED — recorded here 2026-08-19 because this
      # block previously ended "do not restart this container until that
      # comparison is confirmed" and never said that it HAD been, which blocks
      # every future reader on a condition already met. Full record: memo
      # `7e80ccb4`. Two instruments, not one:
      #   1. Weight revision read off both nodes — `refs/main` =
      #      5cf2132abc99cad020ac570b19d031efec650f2b on gpu3, IDENTICAL to the
      #      gpu2 pod that wrote the existing index.
      #   2. Vectors compared against a CALIBRATED control, because GPU kernels
      #      are not bit-deterministic and an a-priori threshold would have been
      #      wrong in either direction:
      #        noise floor   (gpu2 vs gpu2)  worst cos 0.999908  max|d| 1.492e-03
      #        cross-endpoint(gpu2 vs gpu3)  worst cos 0.999860  max|d| 1.387e-03
      #      Cross-endpoint came in SMALLER than the same-pod floor.
      # ⇒ The passage index legitimately spans both endpoints (chunks date from
      # 08-10, before the 08-12 move) and that is NOT a mixed-model corpus.
      # ⚠️ Re-measure if either pod is redeployed: the finding is about the weights
      # those two pods held, not about the URLs.
      #
      # WHY: the shared pool at :31536 runs a sustained 550-775 sequence backlog
      # from another client's bulk batches, which put fleet /recall at 54-115s
      # (incident memo `7e80ccb4`). :31541 is a separate deployment on gpu3's
      # 3060, EXCLUSIVE to memo — it deliberately does not join the shared
      # `embeddings`/`embeddings-lan` pool. Uncontended is the whole point; if
      # anything else starts using it, tell `models`.
      # Rollback is this line only, back to http://192.168.1.5:31536/v1.
      EMBEDDING_MODEL: qwen3-embedding-4b
      EMBEDDING_DIMENSIONS: 2560
      # ⭐ 2026-10-08: BASE URL ONLY moved BACK to the shared pool at :31536.
      # Ben approved in #models 11:13 ET (ask `a19`, his "yes" at ts
      # 1791472433.273449), to free gpu3's embedding card for the signal
      # searchers. `models` relayed it and asked for memo's agreement too.
      # Model name and width UNCHANGED — the safe shape of this edit per the
      # warnings above.
      # ✅ RE-MEASURED BEFORE THE SWITCH, as the 08-19 block requires whenever
      # either pod may have been redeployed (the finding is about WEIGHTS, not
      # URLs). Measured by `memo` 2026-10-08, 4 texts, 2560-d both sides:
      #   noise floor :31541 vs itself   worst cos 0.999909  max|d| 2.062e-03
      #   noise floor :31536 vs itself   worst cos 0.999914  max|d| 2.062e-03
      #   CROSS :31541 vs :31536         worst cos 0.999935  max|d| 1.084e-03
      # Cross came in BETTER than either same-pod floor, reproducing the 08-19
      # result. Orthogonality control: two DIFFERENT texts across endpoints give
      # cos 0.3464, so the comparison is live and not degenerate.
      # ⚠️ `models` reported this as "cosine 1.000000". It is NOT 1.0 — there is
      # a real noise floor because GPU kernels are not bit-deterministic. The
      # gate is cos >= 0.9999 against a measured floor, never equality; an
      # equality test would fail on identical weights and teach the wrong lesson.
      # ⛔ THE CONTENTION THAT CAUSED THIS ENDPOINT TO BE ABANDONED IS NOT FIXED,
      # IT IS ONLY ABSENT. :31536 is the SHARED pool whose 550-775 sequence
      # backlog from another client's bulk batches put fleet /recall at 54-115s
      # (incident `7e80ccb4`) — that is why :31541 existed. Measured at cutover:
      # both endpoints num_requests_running=0, num_requests_waiting=0, latency
      # 0.09-0.11s. `models`'s case is 70-700 req/h with no backlog, which
      # describes the STEADY STATE; the incident was an EPISODIC bulk batch, so
      # request rate is the wrong instrument. ⇒ The discriminator is
      # `num_requests_waiting` on :31536, not req/h. If /recall slows, read that
      # first and tell `models`.
      # ⚠️ memo now has NO separate dedicated embedder. FAILOVER POSTURE, settled
      # with `models` 2026-10-08 15:22Z and VERIFIED here:
      #   ⛔ :31541  HAS NO BOUNDED RESTORE, because the restore is gated on an
      #              OPERATOR DECISION, not on a start-up time. `models`
      #              2026-10-09 16:39Z, stated correctly WITH its precondition:
      #              "possible, PROVIDED Ben agrees to take the card from the lab.
      #              Once he does, the restore takes <=~1h."
      #              ⛔⛔ DO NOT RECORD WHO CURRENTLY HOLDS THE CARD. This block
      #              said "a restore now needs Ben to displace `scout`" and that
      #              was FALSE WITHIN THREE HOURS: the card went embedder ->
      #              gpusearch (10-08 15:24Z) -> scout (10-09 09:42 ET, Ben in
      #              #scout-avatar) -> back to gpusearch (10-09 12:36 ET, Ben in
      #              #quantum-lab-search: "you can take that card back from scout
      #              Avatar ... it can pause"). THREE holders in two days.
      #              ⇒ Tenancy is as volatile as the runway figure this same file
      #              forbids caching, and for the identical reason: it is a fact
      #              about OTHER tenants' moment, not about memo. Record the
      #              STRUCTURE — the card is NOT memo's, a restore needs Ben, and
      #              `models` is the seat that knows who has it. ASK, never cache.
      #              ✅ THE CARD IS SETTLED BY UUID, NOT BY NAME — and the name is
      #              genuinely ambiguous, so ALWAYS USE THE UUID:
      #                :31541's card = **GPU-b969e81d-616a-383d-1ff2-e9cbeb412870**
      #                (RTX 3060 12GB). `models` calls it gpu3/gpu-1;
      #                `quantum-lab` calls it gpu3b. SAME CARD.
      #                `quantum-lab`'s "gpu3" is a DIFFERENT card,
      #                GPU-a7cb94e8-6970-5b0d-88e5-ffc280954f90 (the old
      #                ollama-gate card), busy on their sweep.
      #              ⭐ VERIFIED BY ME 2026-10-09 12:46 ET in server_admin, not
      #              taken from the relay (⛔ note the repo is `server_admin` with
      #              an UNDERSCORE; /mnt/nas/data/code/server-admin does not
      #              exist and looking there returns a misleading "no such file"):
      #                k8s/embeddings/embeddings-gpu3.yaml:63  "= GPU-b969e81d... <- ours"
      #                k8s/embeddings/embeddings-gpu3.yaml:104 device claim pins that UUID
      #                k8s/embeddings/embeddings-gpu3.yaml:143 CUDA_VISIBLE_DEVICES same UUID
      #                k8s/embeddings/embeddings-gpu3-dev2.yaml:43 pins GPU-a7cb94e8 (the OTHER card)
      #                k8s/ollm/ollama-gate-gpu3.yaml:99         pins GPU-a7cb94e8 (the OTHER card)
      #              ⛔ THE FILENAME IS THE TRAP: "embeddings-gpu3.yaml" holds
      #              gpu3b's UUID while "embeddings-gpu3-dev2.yaml" holds a
      #              different card's. The file name is not the card.
      #              ⭐⭐ AND THE ONE WORTH CARRYING: that same manifest, at
      #              :113, ALREADY STATED THE PRECONDITION — "Restore: replicas 1
      #              AFTER LAB FREES THE CARD (~1h worst)". The owning seat wrote
      #              the condition and the number together. By the time it reached
      #              THIS file it had become a bare "<=~1 h ... the one to plan
      #              on". ⇒ A PRECONDITION IS THE FIRST THING LOST IN TRANSIT,
      #              because the NUMBER is what the reader came for. When you copy
      #              a figure out of someone else's artifact, copy the clause that
      #              qualifies it or do not copy the figure. Memo `fa10becb`.
      #   ⛔⛔ THE PREVIOUS THREE LINES SAID "<=~1 h ... this is the one to plan
      #              on" WHILE THE LINE BELOW THEM ALREADY SAID "card lent to
      #              gpusearch". I wrote both on 10-08 and the promise outlived
      #              the fact that voided it, because the promise was the one
      #              carrying a NUMBER and came from another seat's SLA, while the
      #              refutation was an observation of my own one line down.
      #              ⇒ A QUOTED SLA IS NOT EVIDENCE ABOUT THE WORLD. When you
      #              record a recovery time, record WHAT MUST STILL BE TRUE for it
      #              to hold; a bare duration cannot be falsified by a later fact
      #              sitting next to it, so it never is. Memo `c8c22268`.
      #   ⚠️ vast1   http://192.168.1.199:11500/v1 — still AUTHORIZED for
      #              unilateral reroute (`models`: "reroute without asking me")
      #              and still gate-verified, so USE IT IF IT ANSWERS. With
      #              :31541 now indefinite, vast1 is the ONLY fallback — `models`
      #              2026-10-09 09:43 ET: "vast1 is still your first fallback".
      #              ⛔ Its absence is still NOT an incident: check it answers,
      #              and if it does not, memo stays single-homed until Ben frees
      #              a card. ⛔⛔ NO RUNWAY NUMBER HERE — this very block carried
      #              "~13 h of prepaid credit" written 2026-10-09 02:30, in
      #              contradiction of the ⛔ rule 50 lines below it, and it was
      #              stale within hours. ASK `cloud`.
      # ⭐⭐ WHY THIS IS TOLERABLE: memo's PRIMARY :31536 is on barn hardware and
      # costs no credit. Only the FAILOVER ever sat on prepaid billing, so losing
      # vast1 degrades RECOVERY (immediate -> <=1 h), never availability.
      # ⚠️ Stated plainly, REVISED 2026-10-09 09:43 ET: memo is SINGLE-HOMED with
      # NO bounded restore and no second credit-free endpoint. vast1 (prepaid,
      # rented) is the only fallback and it is not planned capacity. Accepted, not
      # solved. ⛔ Ben has now assigned gpu3's card away from embedding TWICE —
      # 10-08 to the searchers, 10-09 to scout's avatar — so this is his settled
      # preference, not an oversight. DO NOT REOPEN IT OR ASK FOR A CARD.
      # ⭐ What degraded is RECOVERY, not availability: PRIMARY :31536 is on barn
      # hardware, costs no credit, and is untouched by any of this.
      # ✅ THE vast1 GATE IS MEASURED, NOT RELAYED — done 2026-10-08 while nothing
      # was broken, because a failover gate first checked during an incident is a
      # gate that gets skipped. 4 texts, both 2560-d, both report model
      # qwen3-embedding-4b:
      #   noise floor :31536 vs itself  worst cos 0.999911  max|d| 1.507e-03
      #   noise floor vast1  vs itself  worst cos 1.000000  max|d| 0.000e+00
      #   CROSS :31536 vs vast1         worst cos 0.999907  max|d| 1.863e-03
      # GATE cos >= 0.9999: PASS. Orthogonality control (two DIFFERENT texts
      # across endpoints) cos 0.3450, so the comparison is live.
      # ⚠️ Two things to carry, both from those numbers:
      #   1. vast1 is BIT-DETERMINISTIC (its own floor is exactly 1.000000,
      #      max|d| 0) while the barn pods are NOT (~0.99991). Different hardware
      #      and kernels. ⇒ The noise floor is a property of the ENDPOINT, not of
      #      the model, so always measure the floor on the endpoint under test.
      #      A "must equal the floor" rule would pass on vast1 and fail on a barn
      #      pod for reasons that have nothing to do with the vectors.
      #   2. Cross (0.999907) is a HAIR BELOW :31536's own floor (0.999911) —
      #      unlike the :31541/:31536 pair, where cross beat both floors. It
      #      clears the gate with little margin. Same space, thinner evidence.
      # ⭐ vast1's max_model_len IS 16384 — IDENTICAL TO THE BARN CONTRACT, so
      # failing over does NOT move the 413 merge boundary: a document that fits
      # today still fits after a reroute. (`cloud` 2026-10-08 11:26 EDT: Vast
      # instance 54528970, RTX A4000, Qwen/Qwen3-Embedding-4B served as
      # `qwen3-embedding-4b`, OpenAI-compatible, no API key.) A fallback with a
      # SMALLER max_model_len would have silently begun refusing writes that
      # previously succeeded, and the refusal would have looked like memo's own
      # boundary rather than the fallback's. The A4000 is also why vast1 is
      # bit-deterministic and the barn 3060s are not.
      # ⚠️ vast1 is a RENTED box on PREPAID credit, so confirm it ANSWERS before
      # rerouting; if it does not, ask `models` for the :31541 restore (<=~1 h).
      # ⛔⛔ NO RUNWAY NUMBER IS WRITTEN HERE ON PURPOSE. ASK `cloud` WHEN YOU NEED
      # ONE. The figure was revised FOUR times in 11 hours on 2026-10-08
      # (~2 days -> ~3 -> ~8-11 -> ~3), and vast1's OWN burn was $0.142/h in every
      # one of those readings. What moved was quantum-lab's V100 search fleet on
      # the same prepaid account: torn down at 17:28, a second run started 23:29.
      # ⇒ On a SHARED PREPAID account the runway is a function of OTHER tenants'
      # behaviour, so it is not a fact about this service and cannot be cached.
      # ⚠️ This file carried "~8 days" for six hours and it was already false.
      # Writing the derived number here is the error; correcting it faster is not
      # the fix. Record the structure, never the quotient. Memo `c8c22268`.
      # STRUCTURE (stable): vast1 $0.142/h. The account also funds quantum-lab's
      # V100 fleet — episodic, unannounced, ~7x vast1's burn when running.
      # quantum-lab's floor kills only ITS boxes at $6 and leaves vast1 up, but
      # `cloud` says that depends on a script it cannot verify, so it is not a
      # guarantee. `memo` is on cloud's $15 and $5 alerts.
      # ⛔ Only Ben can add credit (console.vast.ai -> Billing; no API, no card).
      # POSTURE 2026-10-09 02:40 EDT: vast1 DROPPED from the plan. Fifth runway
      # revision in 13 h put it at ~13 h of life, after a THIRD unannounced tenant
      # (instance 54966927 `avatar-infinitetalk`, A100, $1.2624/h) took nearly
      # half the account's burn. ✅ OWNER IDENTIFIED 2026-10-09 from #scout-avatar:
      # it is `scout`'s avatar render. scout reported run-07 as "62 min of GPU
      # time, about $1.20" and now caps itself at a $15 credit floor. `cloud`
      # raised this box with Ben as UNATTRIBUTED; it is attributable. It is NOT
      # quantum-lab's $6 floor. ⇒ No top-up was requested: the loss costs <=1 h of
      # recovery, the account also funds mind's EDGAR drain so the spend is not
      # memo's to frame, and `cloud` has already raised the unattributed box with
      # Ben in #cloud. Memo `c8c22268` carries the full reasoning.
      # ⚠️ Do NOT read the lab's runway figure as vast1's: `memo` did exactly that
      # on 2026-10-08 and called a ~3-day fallback "hours from expiry". The ~$2/h
      # runway in #models describes quantum-lab's V100s, not this $0.142/h box.
      # A quoted figure carries its own denominator. Memo `c8c22268`.
      EMBEDDING_BASE_URL: http://192.168.1.5:31536/v1
      EMBEDDING_API_KEY: not-required-lan-service
      # ⭐ RANK BY PASSAGE, DELIVER THE DOCUMENT. [002/FR-117, research.md R-20]
      # Measured on the pinned sample, 256 questions with a unique-literal answer:
      #   path        ranks right doc   answer in SPAN   answer in FULL DOC
      #   document          74.5%            95.8%             95.8%
      #   passages          84.0%            77.3%             98.7%
      # Passage retrieval is the best RETRIEVER and the worst DELIVERER, so both
      # `/search` and `/context` take its ranking and return the whole document.
      # ⛔ Hard-coded, like the embedding settings above and for the same reason:
      # a `${VAR:-default}` here would let a shell export change which index
      # answers, and two runs would differ with nothing in the record saying why.
      # memo-qa-suite now reads this back off the live container per run.
      MEMO_RETRIEVAL_PATH: passages
      # ⛔ SPAN WINDOWING IS OFF, AND THE MEASUREMENT IS WHY. [002/FR-120, R-25]
      # Tried at 160 tokens either side of the matched passage. It did exactly
      # what it promised mechanically and made the product worse:
      #   whole documents   90.8% answers · 5.25 docs · 93.2% truncated
      #   windowed ±160     82.1% answers · 7.77 docs · 81.7% truncated
      # ⇒ MORE documents, LESS truncation, 8.8pt FEWER ANSWERS — far outside the
      # ~2.4pt floor. Capacity was never the binding constraint; FIDELITY was.
      # ⚠️ Do not re-enable by widening the window without re-measuring: a wider
      # window converges on whole-document packing, so the knob's best value is
      # the one that turns it off. The code stays because it is tested and
      # reversible, and because a future chunker may change the trade.
      MEMO_CONTEXT_SPAN_WINDOW: 0
      # Fleet-wide transcript search: restricted key + host keys, no mounts.
      TRANSCRIPT_SEARCH_SSH_KEY: /run/secrets/ts-key
      TRANSCRIPT_SEARCH_KNOWN_HOSTS: /run/secrets/known_hosts
      # Never trust this container's own local view — see the mount note above.
      TRANSCRIPT_SEARCH_FORCE_REMOTE: "1"
      MEMO_CONDUCTOR_PROVIDER: ${MEMO_CONDUCTOR_PROVIDER:-atc}
      MEMO_AGENT_CONTROLLER_PROVIDER: ${MEMO_AGENT_CONTROLLER_PROVIDER:-agents_supervisor}
      MEMO_V2_VERSION: 2.0.0-alpha1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${MEMO_V2_PORT:-8091}/health')"]
      interval: 300s
      timeout: 10s
      retries: 3

  # Test runner. Profile-gated so `docker compose up` never starts it and it is
  # never treated as an orphan.
  #
  #   docker compose run --rm test              # whole suite
  #   docker compose run --rm test <pytest args>
  #
  # Tests MUST run here, never on the host: the project requires Python >=3.12
  # (server4's host python is 3.10) and the host's fastapi/starlette pair is
  # mismatched badly enough that `import memo.main` raises inside FastAPI's own
  # constructor — so a host run silently SKIPS every test that imports the app
  # and reports a smaller, passing number. That is how a host run reported
  # "73 passed" while the real suite is 89 (2026-07-29).
  #
  # Uses a throwaway /tmp DB inside the container and does NOT mount
  # memo_v2_data, so a test run can never touch the real store.
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    network_mode: none
    environment:
      # Settings requires this; tests pass dummy embedding vectors and never
      # make an outbound call, so a placeholder is sufficient.
      OPENROUTER_API_KEY: test-dummy-key
      DEFAULT_DB_PATH: /tmp/memo-test.db

volumes:
  memo_v2_data:
